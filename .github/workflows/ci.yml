name: PR Auto-merge

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0

      - name: Install root dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Install agent-host dependencies
        shell: bash
        working-directory: agent-host
        run: bun install --frozen-lockfile

      - name: Build and smoke-test agent-host
        shell: bash
        working-directory: agent-host
        run: bun run build && bun run smoke

      - name: Run tests
        shell: bash
        run: bun run test

      - name: Check format
        shell: bash
        run: bun run fmt

      - name: Run lint
        shell: bash
        run: bun run lint


  # `bun test` runs against the repo checkout, where `agent-host/src` exists, so it
  # can never observe a file that is missing from the built image. This job is the
  # only thing that actually starts the container: a real
  # `Cannot find module '../../agent-host/src/lib/sql-guard'` startup crash shipped
  # because nothing did.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run container e2e smoke test
        shell: bash
        run: bash scripts/e2e-smoke.sh


  automerge:
    runs-on: ubuntu-latest
    needs: [test, e2e-smoke]
    if: github.event.pull_request.user.login == 'renovate[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: automerge
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67 # v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: "automerge"
