name: PR Auto-merge

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Install root dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Install agent-host dependencies
        shell: bash
        working-directory: agent-host
        run: bun install --frozen-lockfile

      - name: Build and smoke-test agent-host
        shell: bash
        working-directory: agent-host
        run: bun run build && bun run smoke

      - name: Run tests
        shell: bash
        run: bun test

      - name: Check format
        shell: bash
        run: bun run fmt

      - name: Run lint
        shell: bash
        run: bun run lint


  automerge:
    runs-on: ubuntu-latest
    needs: test
    if: github.event.pull_request.user.login == 'renovate[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: automerge
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: "automerge"
