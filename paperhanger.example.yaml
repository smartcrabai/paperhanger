# Example paperhanger configuration.
#
# Copy this file to paperhanger.yaml (or point PAPERHANGER_CONFIG at a copy)
# and fill in the environment variables it references. Secrets are never
# written inline here -- only as ${ENV_VAR} references, expanded at load
# time. See docs/spec.md section 3.9 for the canonical schema.

server:
  port: 8080
  # Required to read GET /incidents and GET /incidents/:id (Authorization:
  # Bearer <token> or X-Api-Token: <token>). Secure by default: leaving this
  # unset makes both endpoints refuse every request with 401, since incident
  # records can carry sensitive diagnosis/failureReason text.
  apiToken: ${PAPERHANGER_API_TOKEN}

# Storage driver. Use "sqlite" for single-instance deployments (mount /data
# as a volume), or "postgres" for replicated deployments.
storage:
  driver: sqlite
  path: /data/paperhanger.db
# storage:
#   driver: postgres
#   url: ${DATABASE_URL}

# One entry per webhook source. The map key is the {source} path segment in
# POST /webhooks/{source}, and must match an implemented SourceAdapter name
# (e.g. "grafana", "generic", "alertmanager", "sentry").
sources:
  grafana:
    secret: ${GRAFANA_WEBHOOK_SECRET}
  generic:
    secret: ${GENERIC_WEBHOOK_SECRET}
  # Sentry Integration Platform webhooks (SaaS or self-hosted): point the
  # internal integration's webhook URL at
  # https://<host>/webhooks/sentry?token=<secret> (Sentry has no custom-header
  # option, so the token rides in the query string). See README.md "Webhook
  # sources" for the full setup.
  # sentry:
  #   secret: ${SENTRY_WEBHOOK_SECRET}

# Discriminated union on `source` (like `storage`/`notifiers` above); exactly
# one of "greptimedb", "loki", "tempo", "prometheus", "clickstack", "signoz",
# "openobserve", "datadog", "newrelic", "grafana", "zabbix", "mackerel",
# "composite" is active at a time. Omit the whole `telemetry` section to run
# without one (see the config reference below). "loki"/"tempo"/"prometheus"
# are single-signal sources -- pick those if you run a Grafana OSS stack with
# those three as separate backends, rather than GreptimeDB's single
# do-everything endpoint; or pick "composite" (see further below) to route
# all three at once instead of picking just one. Only "greptimedb" exposes a
# follow-up query_telemetry tool to the fix agent during diagnosis -- every
# source here still feeds the initial collection phase (composite included,
# even when one of its slots is "greptimedb"). Zabbix and Mackerel are
# monitoring systems, not log/trace stores, so their collection is
# necessarily best-effort (see README.md's config reference and
# src/telemetry/{zabbix,mackerel}.ts's module doc comments). The
# alternatives below are commented out.
telemetry:
  source: greptimedb
  url: ${GREPTIMEDB_URL}
  database: public
  auth: ${GREPTIMEDB_AUTH}
  # Optional overrides, only needed if your deployment renamed the
  # OTLP-ingested tables or wants a non-default per-request HTTP timeout:
  # logsTable: opentelemetry_logs
  # tracesTable: opentelemetry_traces
  # timeoutMs: 30000
# telemetry:
#   source: datadog
#   apiKey: ${DATADOG_API_KEY}
#   appKey: ${DATADOG_APP_KEY}
#   site: datadoghq.com # or datadoghq.eu, us3.datadoghq.com, ...
# telemetry:
#   source: newrelic
#   apiKey: ${NEW_RELIC_API_KEY} # NerdGraph User API key, "NRAK-..."
#   accountId: 1234567
#   region: US # or EU
# telemetry:
#   source: grafana
#   url: https://myorg.grafana.net
#   serviceAccountToken: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
#   # Each UID is optional; the corresponding signal is skipped if omitted.
#   lokiDatasourceUid: ${GRAFANA_LOKI_UID}
#   tempoDatasourceUid: ${GRAFANA_TEMPO_UID}
#   prometheusDatasourceUid: ${GRAFANA_PROMETHEUS_UID}
# telemetry:
#   source: zabbix
#   url: https://zabbix.example.com/zabbix # without /api_jsonrpc.php
#   apiToken: ${ZABBIX_API_TOKEN} # assumes Zabbix >= 6.4 (Authorization: Bearer)
# telemetry:
#   source: mackerel
#   apiKey: ${MACKEREL_API_KEY}

# Alternative telemetry sources for a Grafana OSS stack (Loki/Tempo/
# Prometheus), each single-signal: queries for the other two signals log a
# warning and return no results rather than failing. Only one `telemetry`
# section may be active -- these are mutually exclusive with the block above
# and with each other.
#
# telemetry:
#   source: loki
#   url: ${LOKI_URL}
#   auth: ${LOKI_AUTH}
#   # Optional: `X-Scope-OrgID` tenant header, for multi-tenant deployments.
#   # orgId: ${LOKI_ORG_ID}
#   # timeoutMs: 30000
#
# telemetry:
#   source: tempo
#   url: ${TEMPO_URL}
#   auth: ${TEMPO_AUTH}
#   # timeoutMs: 30000
#
# telemetry:
#   source: prometheus
#   url: ${PROMETHEUS_URL}
#   auth: ${PROMETHEUS_AUTH}
#   # timeoutMs: 30000

# ClickStack (ClickHouse's observability stack, successor of HyperDX): talks
# directly to ClickHouse's HTTP interface (SQL), not a separate HyperDX API.
# Metrics collection is unsupported -- ClickHouse has no PromQL-compatible
# query endpoint (see docs/spec.md section 3.4).
# telemetry:
#   source: clickstack
#   url: ${CLICKSTACK_URL}       # ClickHouse HTTP interface, e.g. http://localhost:8123
#   database: default
#   auth: ${CLICKSTACK_AUTH}     # username:password; omit if ClickHouse auth is disabled
#   # logsTable: otel_logs
#   # tracesTable: otel_traces
#   # timeoutMs: 30000

# SigNoz: the unified query_range API (v5). Metrics collection is unsupported --
# SigNoz's builder API takes a metric name + aggregation spec, not raw PromQL.
# telemetry:
#   source: signoz
#   url: ${SIGNOZ_URL}
#   apiKey: ${SIGNOZ_API_KEY}     # sent as the SIGNOZ-API-KEY header
#   # timeoutMs: 30000

# OpenObserve: the _search API (SQL-style, per-stream). Metrics use an inferred
# Prometheus-compatible query_range path (see docs/spec.md section 3.4 for the
# caveat -- not verified against a live instance).
# telemetry:
#   source: openobserve
#   url: ${OPENOBSERVE_URL}
#   organization: default
#   auth: ${OPENOBSERVE_AUTH}    # username:password; sent as HTTP Basic auth
#   # logsStream: default
#   # tracesStream: default
#   # timeoutMs: 30000

# Composite: routes each signal to its own backend instead of picking one for
# all three -- the standard Grafana OSS setup (Loki + Tempo + Prometheus) is
# the motivating case, but any mix of the sources above works (any source
# except "composite" itself is a valid slot value; nesting is rejected).
# Only the slot's own query method is ever called (a source in "logs:" never
# has its queryTraces/queryMetrics invoked, even if it implements them). At
# least one of logs/traces/metrics is required. An unset slot returns no
# results (logged once at startup, not per query); a slot whose backend
# can't structurally serve that signal (e.g. "loki" under traces:) logs a
# startup warning rather than failing. A slot's query failure degrades only
# that signal, not the whole incident -- see src/telemetry/composite.ts.
# Cross-backend trace correlation (matching logs' trace_id against a
# different traces: backend) is the operator's responsibility, and is
# meaningless if logs: is zabbix/mackerel (their problem/alert history
# carries no trace_id at all).
# telemetry:
#   source: composite
#   logs:
#     source: loki
#     url: ${LOKI_URL}
#   traces:
#     source: tempo
#     url: ${TEMPO_URL}
#   metrics:
#     source: prometheus
#     url: ${PROMETHEUS_URL}

# Self-instrumentation: where paperhanger exports ITS OWN OTLP traces (see
# src/observability/tracing.ts). Distinct from `telemetry` above, which is
# where paperhanger reads other services' telemetry from. Omit this whole
# section to run with tracing disabled (the default).
# observability:
#   endpoint: http://localhost:4318/v1/traces
#   serviceName: paperhanger
#   headers:
#     x-greptime-db-name: public
#     Authorization: Bearer ${OTEL_EXPORTER_AUTH_TOKEN}
#   # Optional: also export paperhanger's own log lines over OTLP/HTTP, in
#   # addition to the stdout JSON-lines sink (which stays primary). Presence
#   # of this subsection is the enable flag; `headers` defaults to the
#   # section-level headers above.
#   logs:
#     endpoint: http://localhost:4318/v1/logs

# Telemetry collection window, relative to the alert's startsAt time.
collect:
  windowBeforeMinutes: 30
  windowAfterMinutes: 5

# Repository resolution: attribute lookup -> dashboard repo definitions ->
# mapping table -> org search. Repo definitions created/edited via the
# dashboard (GET /dashboard) take precedence over `mappings` below and can
# each carry their own per-repo setup script (run in the clone before
# diagnosis) and test-command override -- see docs/spec.md section 3.11.
repos:
  attributeKeys:
    - service.repository
    - repository
  mappings:
    - match: { service: my-api }
      repo: my-org/my-api
  orgSearch:
    enabled: true
    org: my-org
  # Per-repository operator instructions, keyed by "owner/repo" (matched
  # case-insensitively). Replaces the common prompt below for that repository
  # rather than stacking on top of it. A dashboard-managed repo definition's
  # own systemPrompt takes precedence over the entry here.
  # systemPrompts:
  #   my-org/my-api: |
  #     This service owns the payment ledger -- never widen a transaction
  #     boundary to make a test pass.

agent:
  model: anthropic/claude-sonnet-4-6
  concurrency: 2
  timeoutMinutes: 30
  cooldownHours: 24
  draftPr: false
  forbiddenPaths:
    - ".github/workflows/**"
  # Config-file fallback for the operator instructions shared by every
  # repository. The dashboard-managed prompt (PUT /system-prompt) wins when
  # set. Sent to the model on every diagnosis, so it spends context budget --
  # and it never relaxes the guardrails below.
  # systemPrompt: |
  #   Prefer the smallest change that makes the failing behavior correct.
  #   Never disable or weaken an existing test to make the suite pass.
  # Guardrail: reject a fix whose diff (additions + deletions) exceeds this.
  maxDiffLines: 500
  # Guardrail: max fix attempts (initial + test-failure retries) per incident
  # before the agent-host workflow gives up.
  maxFixAttempts: 3
  # Port the spawned agent-host (Flue) sidecar listens on. Ignored when
  # hostUrl is set below.
  hostPort: 8700
  # Set to point at an externally deployed agent-host instead of spawning a
  # local child process (see src/agent/sidecar.ts and agent-host/README.md).
  # hostUrl: http://agent-host:8700
  # Only used alongside hostUrl above: bearer token an externally deployed
  # agent-host must present to this deployment's POST /telemetry/query
  # follow-up-telemetry callback route. The internal (default, no hostUrl)
  # sidecar mode needs none of this -- it generates a random per-boot token
  # itself. Also set the identical value on the external agent-host's own
  # PAPERHANGER_TELEMETRY_CALLBACK_TOKEN environment variable.
  # telemetryCallbackToken: ${TELEMETRY_CALLBACK_TOKEN}

github:
  appId: ${GITHUB_APP_ID}
  privateKey: ${GITHUB_APP_PRIVATE_KEY}

notifiers:
  - type: slack
    webhookUrl: ${SLACK_WEBHOOK_URL}
